<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>متجر عناية الحيوانات الأليفة</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <header class="bg-white shadow p-4 text-center font-bold text-xl text-indigo-600">
        🐾 براند مستلزمات الحيوانات الأليفة
    </header>

    <main class="max-w-6xl mx-auto p-6">
        <h2 class="text-2xl font-bold mb-6 text-gray-800 text-center">المنتجات المميزة (الـ 4 بطلة)</h2>
        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- يتم تعبئة المنتجات تلقائياً عبر JavaScript -->
        </div>
    </main>

    <script>
        fetch('/api/products')
            .then(res => res.json())
            .then(products => {
                const grid = document.getElementById('products-grid');
                grid.innerHTML = products.map(p => `
                    <div class="bg-white rounded-lg shadow overflow-hidden flex flex-col justify-between">
                        <img src="${p.image}" alt="${p.name}" class="h-48 w-full object-cover">
                        <div class="p-4 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-lg mb-1">${p.name}</h3>
                                <p class="text-gray-600 text-sm mb-4">${p.description}</p>
                            </div>
                            <div>
                                <span class="text-indigo-600 font-bold text-xl block mb-3">$${p.price}</span>
                                <button onclick="buyProduct(${p.id}, '${p.name}')" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700 transition">اطلب الآن</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            });

        function buyProduct(productId, productName) {
            const name = prompt(`أدخل اسمك الكريم لطلب: ${productName}`);
            const phone = prompt("رقم الهاتف:");
            const address = prompt("عنوان الشحن بالتفصيل:");

            if(name && phone && address) {
                fetch('/api/orders', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ product_id: productId, customer_name: name, phone, address })
                }).then(res => res.json()).then(data => {
                    if(data.success) alert('تم إرسال طلبك بنجاح! سنتواصل معك قريباً.');
                });
            }
        }
    </script>
</body>
</html>
