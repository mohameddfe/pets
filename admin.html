<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - إدارة الطلبات</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-6">
    <div class="max-w-4xl mx-auto bg-white shadow rounded-lg p-6">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">📊 لوحة تحكم المتجر (الطلبات الواردة)</h1>
        <table class="w-full border-collapse border border-gray-200 text-right">
            <thead>
                <tr class="bg-gray-100">
                    <th class="border border-gray-200 p-2">رقم الطلب</th>
                    <th class="border border-gray-200 p-2">المنتج</th>
                    <th class="border border-gray-200 p-2">اسم العميل</th>
                    <th class="border border-gray-200 p-2">الهاتف</th>
                    <th class="border border-gray-200 p-2">العنوان</th>
                </tr>
            </thead>
            <tbody id="orders-table">
                <!-- يتم تعبئة الطلبات هنا -->
            </tbody>
        </table>
    </div>

    <script>
        fetch('/api/orders')
            .then(res => res.json())
            .then(orders => {
                const tbody = document.getElementById('orders-table');
                tbody.innerHTML = orders.map(o => `
                    <tr>
                        <td class="border border-gray-200 p-2">#${o.id}</td>
                        <td class="border border-gray-200 p-2 font-bold text-indigo-600">${o.product_name}</td>
                        <td class="border border-gray-200 p-2">${o.customer_name}</td>
                        <td class="border border-gray-200 p-2">${o.phone}</td>
                        <td class="border border-gray-200 p-2">${o.address}</td>
                    </tr>
                `).join('');
            });
    </script>
</body>
</html>
